# Flavor "stock-image": kubeadm control plane + one MachineDeployment on Verda,
# booting from a stock Verda Ubuntu image and installing kubeadm at boot, with
# the provider-managed control plane load balancer.
# Prefer the default flavor with an image-builder OS volume when available.
#
# Required variables:
#   CLUSTER_NAME, KUBERNETES_VERSION, VERDA_LOCATION, VERDA_SSH_KEY_ID
# Optional:
#   CONTROL_PLANE_MACHINE_COUNT (1), WORKER_MACHINE_COUNT (1),
#   VERDA_CONTROL_PLANE_INSTANCE_TYPE, VERDA_WORKER_INSTANCE_TYPE, VERDA_IMAGE,
#   POD_CIDR (192.168.0.0/16)
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["${POD_CIDR:=192.168.0.0/16}"]
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: ${CLUSTER_NAME}-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: VerdaCluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VerdaCluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  location: ${VERDA_LOCATION}
  controlPlaneLoadBalancer:
    enabled: true
    sshKeyIDs:
      - ${VERDA_SSH_KEY_ID}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VerdaMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  template:
    spec:
      instanceType: ${VERDA_CONTROL_PLANE_INSTANCE_TYPE:=CPU.4V.16G}
      image: ${VERDA_IMAGE:=ubuntu-24.04}
      sshKeyIDs:
        - ${VERDA_SSH_KEY_ID}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT:=1}
  version: ${KUBERNETES_VERSION}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VerdaMachineTemplate
        name: ${CLUSTER_NAME}-control-plane
  kubeadmConfigSpec:
    preKubeadmCommands:
      - /usr/local/bin/install-kubernetes.sh ${KUBERNETES_VERSION}
    files:
      - path: /usr/local/bin/install-kubernetes.sh
        permissions: "0755"
        content: |
          #!/bin/bash
          # Installs containerd, kubeadm, kubelet and kubectl on a stock Ubuntu
          # image. Skip by using an image that already has them (image-builder).
          set -euo pipefail
          VERSION="${1#v}"
          MINOR="${VERSION%.*}"
          if command -v kubeadm >/dev/null 2>&1; then exit 0; fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y apt-transport-https ca-certificates curl gpg containerd
          mkdir -p /etc/containerd
          containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
          systemctl restart containerd
          mkdir -p /etc/apt/keyrings
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
          apt-get update
          apt-get install -y "kubelet=${VERSION}-*" "kubeadm=${VERSION}-*" "kubectl=${VERSION}-*"
          apt-mark hold kubelet kubeadm kubectl
          modprobe br_netfilter || true
          cat > /etc/sysctl.d/99-kubernetes.conf <<SYSCTL
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
          SYSCTL
          sysctl --system >/dev/null
          swapoff -a
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
          - name: provider-id
            value: "verda://{{ ds.meta_data.hostname }}"
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
          - name: provider-id
            value: "verda://{{ ds.meta_data.hostname }}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VerdaMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  template:
    spec:
      instanceType: ${VERDA_WORKER_INSTANCE_TYPE:=CPU.4V.16G}
      image: ${VERDA_IMAGE:=ubuntu-24.04}
      sshKeyIDs:
        - ${VERDA_SSH_KEY_ID}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  template:
    spec:
      preKubeadmCommands:
        - /usr/local/bin/install-kubernetes.sh ${KUBERNETES_VERSION}
      files:
        - path: /usr/local/bin/install-kubernetes.sh
          permissions: "0755"
          content: |
            #!/bin/bash
            set -euo pipefail
            VERSION="${1#v}"
            MINOR="${VERSION%.*}"
            if command -v kubeadm >/dev/null 2>&1; then exit 0; fi
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y apt-transport-https ca-certificates curl gpg containerd
            mkdir -p /etc/containerd
            containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
            systemctl restart containerd
            mkdir -p /etc/apt/keyrings
            curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
            echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
            apt-get update
            apt-get install -y "kubelet=${VERSION}-*" "kubeadm=${VERSION}-*" "kubectl=${VERSION}-*"
            apt-mark hold kubelet kubeadm kubectl
            modprobe br_netfilter || true
            cat > /etc/sysctl.d/99-kubernetes.conf <<SYSCTL
            net.bridge.bridge-nf-call-iptables = 1
            net.ipv4.ip_forward = 1
            SYSCTL
            sysctl --system >/dev/null
            swapoff -a
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            - name: cloud-provider
              value: external
            - name: provider-id
              value: "verda://{{ ds.meta_data.hostname }}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT:=1}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: ${CLUSTER_NAME}-md-0
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VerdaMachineTemplate
        name: ${CLUSTER_NAME}-md-0
---
# Replace control plane machines whose node stops reporting (e.g. a
# discontinued spot instance). KubeadmControlPlane performs the remediation.
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  clusterName: ${CLUSTER_NAME}
  selector:
    matchLabels:
      cluster.x-k8s.io/control-plane: ""
  remediation:
    triggerIf:
      unhealthyLessThanOrEqualTo: 100%
  checks:
    nodeStartupTimeoutSeconds: 1200
    unhealthyNodeConditions:
      - type: Ready
        status: Unknown
        timeoutSeconds: 300
      - type: Ready
        status: "False"
        timeoutSeconds: 300
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  clusterName: ${CLUSTER_NAME}
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: ${CLUSTER_NAME}-md-0
  remediation:
    triggerIf:
      unhealthyLessThanOrEqualTo: 40%
  checks:
    nodeStartupTimeoutSeconds: 1200
    unhealthyNodeConditions:
      - type: Ready
        status: Unknown
        timeoutSeconds: 300
      - type: Ready
        status: "False"
        timeoutSeconds: 300
---
# Cloud controller manager: installed into the workload cluster by a
# ClusterResourceSet. Kubelets run with --cloud-provider=external and stay
# tainted until it initialises them.
apiVersion: v1
kind: Secret
metadata:
  name: ${CLUSTER_NAME}-verda-ccm-credentials
type: addons.cluster.x-k8s.io/resource-set
stringData:
  credentials.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: verda-cloud-credentials
      namespace: kube-system
    stringData:
      client-id: ${VERDA_CLIENT_ID}
      client-secret: ${VERDA_CLIENT_SECRET}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${CLUSTER_NAME}-verda-ccm
data:
  verda-cloud-controller-manager.yaml: |
    # Verda cloud controller manager, to be applied to a workload cluster whose
    # kubelets run with --cloud-provider=external. Credentials come from the
    # verda-cloud-credentials Secret in kube-system (keys: client-id, client-secret).
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: verda-cloud-controller-manager
      namespace: kube-system
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: verda-cloud-controller-manager
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-admin
    subjects:
      - kind: ServiceAccount
        name: verda-cloud-controller-manager
        namespace: kube-system
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: verda-cloud-controller-manager
      namespace: kube-system
      labels:
        app.kubernetes.io/name: verda-cloud-controller-manager
    spec:
      replicas: 1
      revisionHistoryLimit: 2
      selector:
        matchLabels:
          app.kubernetes.io/name: verda-cloud-controller-manager
      template:
        metadata:
          labels:
            app.kubernetes.io/name: verda-cloud-controller-manager
        spec:
          serviceAccountName: verda-cloud-controller-manager
          # Must run before the CNI and on tainted control plane nodes.
          hostNetwork: true
          dnsPolicy: Default
          priorityClassName: system-cluster-critical
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node.cloudprovider.kubernetes.io/uninitialized
              value: "true"
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              effect: NoSchedule
            - key: node.kubernetes.io/not-ready
              effect: NoSchedule
            - key: node.kubernetes.io/network-unavailable
              effect: NoSchedule
          containers:
            - name: cloud-controller-manager
              image: docker.io/hriships/verda-cloud-controller-manager:v0.1.0
              args:
                - --cloud-provider=verda
                - --leader-elect=true
                - --allow-untagged-cloud=true
                - --use-service-account-credentials=false
                - --secure-port=10258
                - --v=2
              env:
                - name: VERDA_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: verda-cloud-credentials
                      key: client-id
                - name: VERDA_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: verda-cloud-credentials
                      key: client-secret
                - name: VERDA_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: verda-cloud-credentials
                      key: base-url
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: ${CLUSTER_NAME}-verda-ccm
spec:
  clusterSelector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
  strategy: Reconcile
  resources:
    - kind: Secret
      name: ${CLUSTER_NAME}-verda-ccm-credentials
    - kind: ConfigMap
      name: ${CLUSTER_NAME}-verda-ccm
