# Flavor "stock-image": kubeadm control plane + one MachineDeployment on Verda,
# booting from a stock Verda Ubuntu image and installing kubeadm at boot.
# Prefer the default flavor with an image-builder OS volume when available.
#
# Verda has no managed load balancer, so CONTROL_PLANE_ENDPOINT_HOST must be a
# DNS name or IP you control that will route to the control plane machine(s).
# For a single control plane node, point it at that node's public IP once known
# (or use a DNS record you update after the first machine comes up).
#
# Required variables:
#   CLUSTER_NAME, KUBERNETES_VERSION, CONTROL_PLANE_ENDPOINT_HOST,
#   VERDA_LOCATION, VERDA_SSH_KEY_ID
# Optional:
#   CONTROL_PLANE_MACHINE_COUNT (1), WORKER_MACHINE_COUNT (1),
#   VERDA_CONTROL_PLANE_INSTANCE_TYPE, VERDA_WORKER_INSTANCE_TYPE, VERDA_IMAGE,
#   POD_CIDR (192.168.0.0/16)
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["${POD_CIDR:=192.168.0.0/16}"]
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: ${CLUSTER_NAME}-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: VerdaCluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VerdaCluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  location: ${VERDA_LOCATION}
  controlPlaneEndpoint:
    host: ${CONTROL_PLANE_ENDPOINT_HOST}
    port: ${CONTROL_PLANE_ENDPOINT_PORT:=6443}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VerdaMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  template:
    spec:
      instanceType: ${VERDA_CONTROL_PLANE_INSTANCE_TYPE:=CPU.4V.16G}
      image: ${VERDA_IMAGE:=ubuntu-24.04}
      sshKeyIDs:
        - ${VERDA_SSH_KEY_ID}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT:=1}
  version: ${KUBERNETES_VERSION}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VerdaMachineTemplate
        name: ${CLUSTER_NAME}-control-plane
  kubeadmConfigSpec:
    preKubeadmCommands:
      # Make the endpoint resolve to this node. Sufficient for a single control
      # plane node; for HA replace with real DNS / an external load balancer.
      - 'grep -q "${CONTROL_PLANE_ENDPOINT_HOST}" /etc/hosts || echo "$(hostname -I | cut -d" " -f1) ${CONTROL_PLANE_ENDPOINT_HOST}" >> /etc/hosts'
      - /usr/local/bin/install-kubernetes.sh ${KUBERNETES_VERSION}
    files:
      - path: /usr/local/bin/install-kubernetes.sh
        permissions: "0755"
        content: |
          #!/bin/bash
          # Installs containerd, kubeadm, kubelet and kubectl on a stock Ubuntu
          # image. Skip by using an image that already has them (image-builder).
          set -euo pipefail
          VERSION="${1#v}"
          MINOR="${VERSION%.*}"
          if command -v kubeadm >/dev/null 2>&1; then exit 0; fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y apt-transport-https ca-certificates curl gpg containerd
          mkdir -p /etc/containerd
          containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
          systemctl restart containerd
          mkdir -p /etc/apt/keyrings
          curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
          apt-get update
          apt-get install -y "kubelet=${VERSION}-*" "kubeadm=${VERSION}-*" "kubectl=${VERSION}-*"
          apt-mark hold kubelet kubeadm kubectl
          modprobe br_netfilter || true
          cat > /etc/sysctl.d/99-kubernetes.conf <<SYSCTL
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1
          SYSCTL
          sysctl --system >/dev/null
          swapoff -a
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: provider-id
            value: "verda://{{ ds.meta_data.hostname }}"
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: provider-id
            value: "verda://{{ ds.meta_data.hostname }}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VerdaMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  template:
    spec:
      instanceType: ${VERDA_WORKER_INSTANCE_TYPE:=CPU.4V.16G}
      image: ${VERDA_IMAGE:=ubuntu-24.04}
      sshKeyIDs:
        - ${VERDA_SSH_KEY_ID}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  template:
    spec:
      preKubeadmCommands:
        - /usr/local/bin/install-kubernetes.sh ${KUBERNETES_VERSION}
      files:
        - path: /usr/local/bin/install-kubernetes.sh
          permissions: "0755"
          content: |
            #!/bin/bash
            set -euo pipefail
            VERSION="${1#v}"
            MINOR="${VERSION%.*}"
            if command -v kubeadm >/dev/null 2>&1; then exit 0; fi
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y apt-transport-https ca-certificates curl gpg containerd
            mkdir -p /etc/containerd
            containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml
            systemctl restart containerd
            mkdir -p /etc/apt/keyrings
            curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
            echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${MINOR}/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
            apt-get update
            apt-get install -y "kubelet=${VERSION}-*" "kubeadm=${VERSION}-*" "kubectl=${VERSION}-*"
            apt-mark hold kubelet kubeadm kubectl
            modprobe br_netfilter || true
            cat > /etc/sysctl.d/99-kubernetes.conf <<SYSCTL
            net.bridge.bridge-nf-call-iptables = 1
            net.ipv4.ip_forward = 1
            SYSCTL
            sysctl --system >/dev/null
            swapoff -a
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            - name: provider-id
              value: "verda://{{ ds.meta_data.hostname }}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT:=1}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: ${CLUSTER_NAME}-md-0
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VerdaMachineTemplate
        name: ${CLUSTER_NAME}-md-0
