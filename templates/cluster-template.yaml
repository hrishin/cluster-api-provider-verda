# Default flavor: kubeadm control plane (HA-capable) + one MachineDeployment on
# Verda. Every machine boots from a clone of a prebuilt OS volume (for example
# one produced by image-builder) that already contains kubeadm, kubelet and
# containerd. The control plane sits behind a provider-managed haproxy
# instance, so no DNS or external load balancer is needed.
#
# Required variables:
#   CLUSTER_NAME, KUBERNETES_VERSION, VERDA_LOCATION, VERDA_OS_VOLUME_ID,
#   VERDA_SSH_KEY_ID
# Optional:
#   CONTROL_PLANE_MACHINE_COUNT (1), WORKER_MACHINE_COUNT (1),
#   VERDA_CONTROL_PLANE_INSTANCE_TYPE, VERDA_WORKER_INSTANCE_TYPE,
#   VERDA_LOAD_BALANCER_INSTANCE_TYPE (CPU.4V.16G), POD_CIDR (192.168.0.0/16)
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["${POD_CIDR:=192.168.0.0/16}"]
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: ${CLUSTER_NAME}-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: VerdaCluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VerdaCluster
metadata:
  name: ${CLUSTER_NAME}
spec:
  location: ${VERDA_LOCATION}
  controlPlaneLoadBalancer:
    enabled: true
    instanceType: ${VERDA_LOAD_BALANCER_INSTANCE_TYPE:=CPU.4V.16G}
    sshKeyIDs:
      - ${VERDA_SSH_KEY_ID}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VerdaMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  template:
    spec:
      instanceType: ${VERDA_CONTROL_PLANE_INSTANCE_TYPE:=CPU.4V.16G}
      osVolumeID: ${VERDA_OS_VOLUME_ID}
      sshKeyIDs:
        - ${VERDA_SSH_KEY_ID}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT:=1}
  version: ${KUBERNETES_VERSION}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VerdaMachineTemplate
        name: ${CLUSTER_NAME}-control-plane
  kubeadmConfigSpec:
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: provider-id
            value: "verda://{{ ds.meta_data.hostname }}"
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: provider-id
            value: "verda://{{ ds.meta_data.hostname }}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VerdaMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  template:
    spec:
      instanceType: ${VERDA_WORKER_INSTANCE_TYPE:=CPU.4V.16G}
      osVolumeID: ${VERDA_OS_VOLUME_ID}
      sshKeyIDs:
        - ${VERDA_SSH_KEY_ID}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            - name: provider-id
              value: "verda://{{ ds.meta_data.hostname }}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT:=1}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: ${CLUSTER_NAME}-md-0
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: VerdaMachineTemplate
        name: ${CLUSTER_NAME}-md-0
---
# Replace control plane machines whose node stops reporting (e.g. a
# discontinued spot instance). KubeadmControlPlane performs the remediation.
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: ${CLUSTER_NAME}-control-plane
spec:
  clusterName: ${CLUSTER_NAME}
  selector:
    matchLabels:
      cluster.x-k8s.io/control-plane: ""
  remediation:
    triggerIf:
      unhealthyLessThanOrEqualTo: 100%
  checks:
    nodeStartupTimeoutSeconds: 1200
    unhealthyNodeConditions:
      - type: Ready
        status: Unknown
        timeoutSeconds: 300
      - type: Ready
        status: "False"
        timeoutSeconds: 300
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: ${CLUSTER_NAME}-md-0
spec:
  clusterName: ${CLUSTER_NAME}
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: ${CLUSTER_NAME}-md-0
  remediation:
    triggerIf:
      unhealthyLessThanOrEqualTo: 40%
  checks:
    nodeStartupTimeoutSeconds: 1200
    unhealthyNodeConditions:
      - type: Ready
        status: Unknown
        timeoutSeconds: 300
      - type: Ready
        status: "False"
        timeoutSeconds: 300
