name: Release

# Tagging vX.Y.Z builds multi-arch images for the manager and the cloud
# controller manager, pushes them to Docker Hub and publishes the clusterctl
# release assets on a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  REGISTRY: docker.io
  IMAGE_REPO: hriships

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: cluster-api-provider-verda
            dockerfile: Dockerfile
            binary: manager
            package: ./cmd
          - name: verda-cloud-controller-manager
            dockerfile: Dockerfile.ccm
            binary: cloud-controller-manager
            package: ./cmd/cloud-controller-manager
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BINARY=${{ matrix.binary }}
            PACKAGE=${{ matrix.package }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  release:
    name: Publish clusterctl assets
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489de35d3 # v4.3.0

      - name: Generate release manifests and charts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make release-manifests IMG="${REGISTRY}/${IMAGE_REPO}/cluster-api-provider-verda:${TAG}"
          for chart in charts/*; do
            helm package "$chart" --version "${TAG#v}" --app-version "${TAG}" --destination out
          done
          # The cloud controller manager image referenced by the templates follows the release tag.
          sed -i "s#${REGISTRY}/${IMAGE_REPO}/verda-cloud-controller-manager:v[0-9.]*#${REGISTRY}/${IMAGE_REPO}/verda-cloud-controller-manager:${TAG}#g" out/cluster-template*.yaml
          ls -l out

      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            out/infrastructure-components.yaml
            out/metadata.yaml
            out/cluster-template.yaml
            out/cluster-template-stock-image.yaml
            out/cluster-template-external-endpoint.yaml
            out/*.tgz
          generate_release_notes: true
