# Builds the Kubernetes node images (packer/) and publishes them as Verda OS
# volumes. Two stages: the node image, then the GPU image layered on a clone
# of it. PRs validate only; pushes to main and manual runs build.
# Repository secrets: VERDA_CLIENT_ID, VERDA_CLIENT_SECRET (the Verda project
# the images are published in) and NODE_SSH_PRIVATE_KEY (the node key pair's
# private half; its public half is baked into the images and the GPU stage
# logs in with it).
name: node-image

on:
  pull_request:
    paths:
      - packer/**
      - "!packer/README.md"
      - .github/workflows/node-image.yml
  push:
    branches: [main]
    paths:
      - packer/**
      - "!packer/README.md"
      - .github/workflows/node-image.yml
  workflow_dispatch:
    inputs:
      location:
        description: Verda datacenter
        default: FIN-03
      instance_type:
        description: Build instance type for the node stage
        default: CPU.4V.16G
      gpu_instance_types:
        description: GPU instance types the gpu stage builds and verifies on, in order of preference (first with capacity wins)
        default: 1RTXPRO6000.30V,1RTXPRO6000.30V.CC,2RTXPRO6000.60V,1A100.22V
      source_image:
        description: Verda image_type to start from
        default: 24.04.base
      artifact_locations:
        description: Extra datacenters to clone into (comma-separated)
        default: ""
      is_spot:
        description: Build on a spot instance
        type: boolean
        default: false
      stages:
        description: Which images to build
        type: choice
        options: [both, node, gpu]
        default: both
      node_image:
        description: "gpu stage only: node image to start from (volume ID or name; default: the newest k8s-node-* in the location, or this run's)"
        default: ""

permissions:
  contents: read

env:
  PACKER_VERSION: "1.16.0"
  PACKER_GITHUB_API_TOKEN: ${{ github.token }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: packer fmt -check -diff packer/
      - run: packer/build.sh validate

  build:
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stages != 'gpu')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    concurrency:
      group: node-image-build
      cancel-in-progress: false
    timeout-minutes: 90
    outputs:
      image_name: ${{ steps.manifest.outputs.image_name }}
    env:
      VERDA_CLIENT_ID: ${{ secrets.VERDA_CLIENT_ID }}
      VERDA_CLIENT_SECRET: ${{ secrets.VERDA_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the node SSH key
        env:
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          [ -n "$NODE_SSH_PRIVATE_KEY" ] || { echo "NODE_SSH_PRIVATE_KEY secret is not set" >&2; exit 1; }
          key="$RUNNER_TEMP/node-ssh-key"
          (umask 077; printf '%s\n' "$NODE_SSH_PRIVATE_KEY" > "$key")
          ssh-keygen -y -f "$key" >/dev/null
          echo "NODE_SSH_KEY_FILE=$key" >> "$GITHUB_ENV"

      - name: Build and publish the node image
        env:
          LOCATION: ${{ inputs.location || 'FIN-03' }}
          INSTANCE_TYPE: ${{ inputs.instance_type || 'CPU.4V.16G' }}
          SOURCE_IMAGE: ${{ inputs.source_image || '24.04.base' }}
          ARTIFACT_LOCATIONS: ${{ inputs.artifact_locations || '' }}
          IS_SPOT: ${{ inputs.is_spot || 'false' }}
        run: |
          BUILD_ID="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          export BUILD_ID
          locations="$(jq -cn --arg l "$ARTIFACT_LOCATIONS" '$l | split(",") | map(gsub("\\s"; "")) | map(select(length > 0))')"
          packer/build.sh build -color=false \
            -var "location=$LOCATION" \
            -var "instance_type=$INSTANCE_TYPE" \
            -var "source_image=$SOURCE_IMAGE" \
            -var "artifact_locations=$locations" \
            -var "is_spot=$IS_SPOT"

      - name: Summary
        id: manifest
        if: always()
        run: |
          if [ -f packer/packer-manifest.json ]; then
            echo "image_name=$(jq -r '.builds[-1].custom_data.image_name' packer/packer-manifest.json)" >> "$GITHUB_OUTPUT"
            jq -r '.builds[-1] |
              "## Node image published\n\n| | |\n|---|---|\n" +
              "| Image | `\(.custom_data.image_name)` |\n" +
              "| Kubernetes | \(.custom_data.kubernetes_version) |\n" +
              "| Source image | \(.custom_data.source_image) |\n" +
              "| Volume ID (\(.custom_data.location)) | `\(.artifact_id)` |\n"
            ' packer/packer-manifest.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Node image build failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packer-manifest-node
          path: packer/packer-manifest.json
          if-no-files-found: ignore

  build-gpu:
    needs: [validate, build]
    # Runs after the node stage, or alone when only the gpu stage is requested.
    if: >-
      always() && needs.validate.result == 'success'
      && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.stages == 'gpu'))
      && (github.event_name == 'workflow_dispatch' && inputs.stages != 'node'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    concurrency:
      group: node-image-build
      cancel-in-progress: false
    timeout-minutes: 120
    outputs:
      image_name: ${{ steps.manifest.outputs.image_name }}
    env:
      VERDA_CLIENT_ID: ${{ secrets.VERDA_CLIENT_ID }}
      VERDA_CLIENT_SECRET: ${{ secrets.VERDA_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the node SSH key
        env:
          NODE_SSH_PRIVATE_KEY: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
        run: |
          [ -n "$NODE_SSH_PRIVATE_KEY" ] || { echo "NODE_SSH_PRIVATE_KEY secret is not set" >&2; exit 1; }
          key="$RUNNER_TEMP/node-ssh-key"
          (umask 077; printf '%s\n' "$NODE_SSH_PRIVATE_KEY" > "$key")
          ssh-keygen -y -f "$key" >/dev/null
          echo "NODE_SSH_KEY_FILE=$key" >> "$GITHUB_ENV"

      - name: Build and publish the GPU image
        env:
          LOCATION: ${{ inputs.location || 'FIN-03' }}
          INSTANCE_TYPE: ${{ inputs.instance_type || 'CPU.4V.16G' }}
          ARTIFACT_LOCATIONS: ${{ inputs.artifact_locations || '' }}
          IS_SPOT: ${{ inputs.is_spot || 'false' }}
          # The node image from this run when there is one, else the input, else the newest.
          NODE_IMAGE: ${{ needs.build.outputs.image_name || inputs.node_image || '' }}
          GPU_INSTANCE_TYPES: ${{ inputs.gpu_instance_types || '1RTXPRO6000.30V,1RTXPRO6000.30V.CC,2RTXPRO6000.60V,1A100.22V' }}
        run: |
          BUILD_ID="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          export BUILD_ID
          locations="$(jq -cn --arg l "$ARTIFACT_LOCATIONS" '$l | split(",") | map(gsub("\\s"; "")) | map(select(length > 0))')"
          packer/build.sh build-gpu -color=false \
            -var "artifact_locations=$locations" \
            -var "is_spot=$IS_SPOT"

      - name: Summary
        id: manifest
        if: always()
        run: |
          if [ -f packer/packer-manifest.json ]; then
            echo "image_name=$(jq -r '.builds[-1].custom_data.image_name' packer/packer-manifest.json)" >> "$GITHUB_OUTPUT"
            jq -r '.builds[-1] |
              "## GPU node image published\n\n| | |\n|---|---|\n" +
              "| Image | `\(.custom_data.image_name)` |\n" +
              "| Kubernetes | \(.custom_data.kubernetes_version) |\n" +
              "| Built from | \(.custom_data.source_node_image) |\n" +
              "| Built and verified on | \(.custom_data.instance_type) |\n" +
              "| Volume ID (\(.custom_data.location)) | `\(.artifact_id)` |\n"
            ' packer/packer-manifest.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## GPU node image build failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packer-manifest-gpu
          path: packer/packer-manifest.json
          if-no-files-found: ignore

  bump-templates:
    # Point the templates and examples at the images this run published and
    # open a pull request for it.
    needs: [build, build-gpu]
    if: always() && (needs.build.result == 'success' || needs.build-gpu.result == 'success') && needs.build-gpu.result != 'failure' && needs.build.result != 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_IMAGE: ${{ needs.build.outputs.image_name }}
      GPU_IMAGE: ${{ needs.build-gpu.outputs.image_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Bump the image defaults
        id: bump
        run: |
          args=()
          [ -z "$NODE_IMAGE" ] || args+=(--node "$NODE_IMAGE")
          [ -z "$GPU_IMAGE" ] || args+=(--gpu "$GPU_IMAGE")
          [ "${#args[@]}" -gt 0 ] || { echo "no images published in this run"; exit 0; }
          hack/bump-images.sh "${args[@]}"
          if git diff --quiet; then
            echo "templates already point at these images"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.bump.outputs.changed == 'true'
        run: |
          build_id="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          branch="bump/node-images-${build_id}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          {
            echo "feat(templates): use the node images built on ${GITHUB_SHA::7}"
            echo
            echo "Built by the node-image workflow (run ${GITHUB_RUN_ID}):"
            [ -z "$NODE_IMAGE" ] || echo "- node image: $NODE_IMAGE"
            [ -z "$GPU_IMAGE" ] || echo "- GPU node image: $GPU_IMAGE"
          } > /tmp/msg
          git commit -q -F /tmp/msg
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "feat(templates): use the node images built on ${GITHUB_SHA::7}" \
            --body-file /tmp/msg
