name: Charts

# Lints the Helm charts on every change and publishes them as OCI artifacts
# to Docker Hub on release tags (Chart.yaml version must equal the tag without the leading v).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "examples/**", "*.md"]
  pull_request:
    paths: ["charts/**", "config/**", "hack/sync-charts.py", ".github/workflows/charts.yml"]

permissions: {}

env:
  REGISTRY: registry-1.docker.io
  OCI_REPO: hriships

jobs:
  lint:
    name: Lint and check sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint charts and verify they match config/
        run: |
          pip3 install --quiet pyyaml
          make lint-charts

  publish:
    name: Publish charts
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | helm registry login "$REGISTRY" --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Package and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Chart.yaml is the source of truth (hack/bump-version.sh); the tag must agree.
          for chart in charts/*; do
            have="$(sed -n 's/^version: //p' "$chart/Chart.yaml")"
            [ "$have" = "${TAG#v}" ] || { echo "$chart/Chart.yaml has version $have, tag is $TAG: run hack/bump-version.sh $TAG before tagging" >&2; exit 1; }
          done
          mkdir -p out/charts
          for chart in charts/*; do
            helm package "$chart" --destination out/charts
          done
          for pkg in out/charts/*.tgz; do
            helm push "$pkg" "oci://$REGISTRY/$OCI_REPO"
          done
