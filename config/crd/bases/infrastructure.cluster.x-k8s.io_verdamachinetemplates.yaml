              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired state of VerdaMachineTemplate.
            properties:
              template:
                description: template is the VerdaMachine template.
                properties:
                  metadata:
                    description: |-
                      metadata is the standard object's metadata.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
                    minProperties: 1
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          annotations is an unstructured key value map stored with a resource that may be
                          set by external tools to store and retrieve arbitrary metadata. They are not
                          queryable and should be preserved when modifying objects.
                          More info: http://kubernetes.io/docs/user-guide/annotations
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          labels is a map of string keys and values that can be used to organize and categorize
                          (scope and select) objects. May match selectors of replication controllers
                          and services.
                          More info: http://kubernetes.io/docs/user-guide/labels
                        type: object
                    type: object
                  spec:
                    description: spec is the specification of the desired behavior
                      of the machine.
                    properties:
                      additionalVolumes:
                        description: |-
                          additionalVolumes are data volumes created with the instance, attached
                          to it and deleted together with it. They are not formatted or mounted;
                          use KubeadmConfig diskSetup/mounts or preKubeadmCommands for that.
                        items:
                          description: AdditionalVolume describes a data volume to
                            create with the instance.
                          properties:
                            name:
                              description: name identifies the volume; the Verda volume
                                is named <machine>-<name>.
                              maxLength: 32
                              minLength: 1
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                            sizeGB:
                              description: sizeGB is the size of the volume in GB.
                              format: int32
                              minimum: 1
                              type: integer
                            type:
                              description: type is the Verda volume type. Defaults
                                to NVMe.
                              enum:
                              - NVMe
                              - HDD
                              - NVMe_Shared
                              - HDD_Shared
                              type: string
                          required:
