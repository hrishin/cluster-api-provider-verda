{{- if .Values.webhooks.enabled }}
{{- $ns := .Release.Namespace }}
{{- $svc := include "capv.webhookServiceName" . }}
{{- $caAnnotation := printf "%s/%s-serving-cert" $ns (include "capv.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  namespace: {{ $ns }}
  labels:
    {{- include "capv.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: webhook-server
  selector:
    {{- include "capv.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
{{- if .Values.webhooks.certManager.enabled }}
---
{{- if not .Values.webhooks.certManager.issuerRef }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "capv.fullname" . }}-selfsigned
  namespace: {{ $ns }}
  labels:
    {{- include "capv.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "capv.fullname" . }}-serving-cert
  namespace: {{ $ns }}
  labels:
    {{- include "capv.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ $svc }}.{{ $ns }}.svc
    - {{ $svc }}.{{ $ns }}.svc.cluster.local
  issuerRef:
    {{- if .Values.webhooks.certManager.issuerRef }}
    {{- toYaml .Values.webhooks.certManager.issuerRef | nindent 4 }}
    {{- else }}
    kind: Issuer
    name: {{ include "capv.fullname" . }}-selfsigned
    {{- end }}
  secretName: {{ include "capv.webhookCertSecretName" . }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "capv.fullname" . }}-mutating
  labels:
    {{- include "capv.labels" . | nindent 4 }}
  {{- if .Values.webhooks.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $caAnnotation }}
  {{- end }}
webhooks:
  {{- range $kind := list "verdacluster" "verdaclustertemplate" "verdamachine" "verdamachinetemplate" }}
  - name: m{{ $kind }}-v1beta1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /mutate-infrastructure-cluster-x-k8s-io-v1beta1-{{ $kind }}
    rules:
      - apiGroups: ["infrastructure.cluster.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["{{ $kind }}s"]
  {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "capv.fullname" . }}-validating
  labels:
    {{- include "capv.labels" . | nindent 4 }}
  {{- if .Values.webhooks.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $caAnnotation }}
  {{- end }}
webhooks:
  {{- range $kind := list "verdacluster" "verdaclustertemplate" "verdamachine" "verdamachinetemplate" }}
  - name: v{{ $kind }}-v1beta1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: {{ $svc }}
        namespace: {{ $ns }}
        path: /validate-infrastructure-cluster-x-k8s-io-v1beta1-{{ $kind }}
    rules:
      - apiGroups: ["infrastructure.cluster.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["{{ $kind }}s"]
  {{- end }}
{{- end }}
