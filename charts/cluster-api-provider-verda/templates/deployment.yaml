apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "capv.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capv.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "capv.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      labels:
        {{- include "capv.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.manager.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "capv.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "capv.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/manager"]
          args:
            - --health-probe-bind-address=:8081
            - --credentials-file=/etc/verda/credentials
            {{- if .Values.manager.leaderElection }}
            - --leader-elect
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            {{- if .Values.webhooks.enabled }}
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
            {{- end }}
            {{- with .Values.manager.watchFilter }}
            - --watch-filter={{ . }}
            {{- end }}
            {{- with .Values.manager.namespace }}
            - --namespace={{ . }}
            {{- end }}
            - --concurrency={{ .Values.manager.concurrency }}
            {{- with .Values.manager.logLevel }}
            - --zap-log-level={{ . }}
            {{- end }}
            {{- with .Values.manager.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if not .Values.webhooks.enabled }}
            - name: ENABLE_WEBHOOKS
              value: "false"
            {{- end }}
            - name: VERDA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "capv.credentialsSecretName" . }}
                  key: client-id
                  optional: true
            - name: VERDA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "capv.credentialsSecretName" . }}
                  key: client-secret
                  optional: true
            - name: VERDA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "capv.credentialsSecretName" . }}
                  key: base-url
                  optional: true
            {{- with .Values.manager.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.webhooks.enabled }}
            - name: webhook-server
              containerPort: 9443
              protocol: TCP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: verda-credentials
              mountPath: /etc/verda
              readOnly: true
            {{- if .Values.webhooks.enabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
      volumes:
        - name: verda-credentials
          secret:
            secretName: {{ include "capv.credentialsSecretName" . }}
            optional: true
        {{- if .Values.webhooks.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "capv.webhookCertSecretName" . }}
        {{- end }}
      {{- with .Values.manager.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.manager.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
