{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "capv.fullname" . }}-manager
  labels:
    {{- include "capv.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "capv.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "capv.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election needs leases and events in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "capv.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capv.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "capv.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capv.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "capv.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "capv.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.metrics.enabled }}
---
# Lets the manager authenticate and authorize metrics scrapers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "capv.fullname" . }}-metrics-auth
  labels:
    {{- include "capv.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "capv.fullname" . }}-metrics-auth
  labels:
    {{- include "capv.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "capv.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "capv.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Grant this to scrapers (e.g. Prometheus) to read /metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "capv.fullname" . }}-metrics-reader
  labels:
    {{- include "capv.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
{{- end }}
{{- end }}
