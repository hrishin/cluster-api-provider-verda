{{- if .Values.credentials.create }}
{{- if or (not .Values.credentials.clientId) (not .Values.credentials.clientSecret) }}
{{- fail "credentials.create requires credentials.clientId and credentials.clientSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capv.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "capv.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .Values.credentials.clientId | quote }}
  client-secret: {{ .Values.credentials.clientSecret | quote }}
  {{- with .Values.credentials.baseUrl }}
  base-url: {{ . | quote }}
  {{- end }}
{{- end }}
